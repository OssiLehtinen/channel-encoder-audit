[project]
name = "fft-encode"
version = "0.1.0"
description = "FDM-style channel encoding vs naive embedding sum benchmark"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.3",
    "numpy>=1.26",
    "tqdm>=4.66",
    "matplotlib>=3.10.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fft_encode"]
