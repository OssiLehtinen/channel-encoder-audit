[project]
name = "fft-encode"
version = "0.2.0"
description = "Input encoders for multi-channel signal transformers: empirical audit of subspace geometry"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.3",
    "numpy>=1.26",
    "tqdm>=4.66",
    "matplotlib>=3.10.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fft_encode"]
